name: CI - Test API Richval
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-api:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: richval
          POSTGRES_PASSWORD: rahasia123
          POSTGRES_DB: toko_val
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Ambil Codingan dari GitHub
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Kebutuhan Flask
        run: |
          pip install -r requirements.txt

      - name: 4. Bikin Tabel di DB GitHub
        env:
          PGPASSWORD: rahasia123
        run: |
          psql -h localhost -U richval -d toko_val -c "
          CREATE TABLE IF NOT EXISTS produk (
            id SERIAL PRIMARY KEY,
            nama VARCHAR(100),
            harga INT,
            kategori VARCHAR(50),
            stok FLOAT
          );"

      - name: 5. Jalanin API-nya
        env:
          DB_HOST: localhost
          DB_USER: richval
          DB_PASSWORD: rahasia123
          DB_NAME: toko_val
        run: |
          nohup python app.py &
          sleep 5
          curl http://localhost:8000/lihat

      - name: 6. Test Docker Build (Bukti Dockerfile lu bener)
        run: |
          docker build -t api-richval .
