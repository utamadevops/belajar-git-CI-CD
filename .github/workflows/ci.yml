nama: CI - Test Api Richval

on:
  push:
    branch: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    service:
      db:
        image: postgres:16
        environtment:
          - POSTGRES_USER: richval
          - POSTGRES_DB: latihan_final
          - POSTGRES_PASSWORD: richval1430
        ports:
          5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        
      steps:
      - name: 1.ambil kodingan
      - uses: actions/checkout@v5
      - name: 2.setup python
      - uses: actions/python@v4
        with: python:3.11-slim
      - name: 3.install
        run: pip install --no-cache-dir -r requirements.txt
      - name: 4.bikin tabel
        env:
        DB_HOST: localhost
        DB_USER: richval
        DB_NAME: latihan_final
        DB_PASSWORD: richval1430
        run: |
        PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -d $DB_NAME -c"
        CREATE TABLE IF NOT EXISTS produk (
        id SERIAL PRIMARY KEY,
        nama VARCHAR(100),
        harga INTEGER,
        stok INTEGER
        );"
      - name: jalanin API + test curl
        env:
        DB_HOST: localhost
        DB_USER: richval
        DB_NAME: latihan_final
        DB_PASSWORD: richval1430
        python app.py &
        sleep 5
        curl http://localhost:9000/produk
      - name: test build docker
        run: docker build -t richval_api . 
