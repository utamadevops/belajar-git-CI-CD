name: CI - richval-Docker-compose

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: ambil kodingan
        uses: actions/checkout@v4
      - name: nyalain semuanya pake docker compose
        run: docker compose up -d --build
      - name: tunggu DB siap
        run: sleep 10
      - name: test API
        run: curl -f http://localhost:8000/health
      - name: matikan docker compose
        run: docker compose down -v